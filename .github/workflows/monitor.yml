name: monitor
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: monitor
  cancel-in-progress: false
jobs:
  revisar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python monitor.py
        env:
          DISCORD_WEBHOOK_ALERTAS: ${{ secrets.DISCORD_WEBHOOK_ALERTAS }}
      - name: Guardar el estado si cambio
        run: |
          git config user.name "jariax-monitor"
          git config user.email "jariax-monitor@users.noreply.github.com"
          git add estado.json
          git diff --cached --quiet || (git commit -m "estado: cambio" && git push)
